<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Archive Ocellus Trainer</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      canvas {
        image-rendering: pixelated;
      }

      #rhythm_banner {
        position: absolute;
        top: 72px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 360px;
        max-width: calc(100% - 80px);
        padding: 12px 18px;
        border: 1px solid #67c884;
        border-radius: 4px;
        background: rgba(15, 20, 17, 0.9);
        color: #b8f4c9;
        text-align: center;
        pointer-events: none;
      }

      #rhythm_banner[data-style="melee"] {
        border-color: #e99b69;
        color: #ffd2b5;
      }

      #rhythm_banner strong { font-size: 20px; }
      #rhythm_banner span { font-size: 12px; color: #eee; }

      #rhythm_mode {
        align-self: center;
        padding: 6px 12px;
        border: 1px solid currentColor;
        border-radius: 3px;
        background: #22271f;
        color: inherit;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        pointer-events: auto;
      }

      #tutorial_intro {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.72);
        pointer-events: auto;
      }

      #tutorial_intro section {
        width: min(440px, calc(100vw - 64px));
        padding: 24px;
        border: 1px solid #78818b;
        border-radius: 8px;
        background: #141b1d;
        line-height: 1.5;
      }

      #tutorial_intro h2 { margin: 8px 0 16px; font-size: 25px; }
      #tutorial_intro li { margin: 10px 0; }
      .tutorial_eyebrow { margin: 0; color: #aebcc6; font-size: 11px; letter-spacing: 2px; }
      .tutorial_step_colour { color: #4ee6a1; }
      .tutorial_position_colour { color: #71bdff; }
      .tutorial_attack_colour { color: #ffd36b; }

      #tutorial_panel {
        position: absolute;
        top: 72px;
        left: 20px;
        box-sizing: border-box;
        width: 286px;
        max-width: calc(100vw - 40px);
        padding: 12px;
        border: 1px solid #78818b;
        border-radius: 4px;
        background: rgba(15, 20, 22, 0.94);
        pointer-events: none;
      }

      #tutorial_panel #rhythm_mode { float: right; padding: 4px 6px; font-size: 11px; }
      #tutorial_cue { display: block; clear: both; padding-top: 8px; font-size: 20px; color: #dce3ea; }
      #tutorial_panel[data-action="step"] #tutorial_cue { color: #4ee6a1; }
      #tutorial_panel[data-action="attack"] #tutorial_cue { color: #ffd36b; }
      #tutorial_panel[data-action="return-to-pair"] #tutorial_cue { color: #71bdff; }
      #tutorial_panel p { margin: 6px 0; font-size: 12px; line-height: 1.4; }
      #tutorial_feedback { min-height: 28px; color: #dce3ea; }
      #tutorial_score { color: #aebcc6; }
      .tutorial_beat { display: flex; gap: 6px; margin: 8px 0; }
      .tutorial_beat span { flex: 1; padding: 5px; border: 1px solid #44505a; color: #78818b; font-size: 12px; text-align: center; }
      .tutorial_beat span:first-child[data-active="true"] { border-color: #4ee6a1; color: #4ee6a1; }
      .tutorial_beat span:last-child[data-active="true"] { border-color: #ffd36b; color: #ffd36b; }
      .tutorial_controls { display: flex; flex-wrap: wrap; gap: 6px; }
      #tutorial_recovery { color: #aebcc6; font-weight: bold; }
      #tutorial_recovery[data-recovery="warning"] { color: #ff7b82; }
      #tutorial_recovery[data-recovery="recovering"] { color: #ffd36b; }
      #tutorial_recovery[data-recovery="recovered"] { color: #4ee6a1; }
      #tutorial_intro button, #tutorial_panel button {
        padding: 8px 12px;
        border: 1px solid #aebcc6;
        border-radius: 4px;
        background: #25342e;
        color: #effff5;
        cursor: pointer;
        pointer-events: auto;
      }
      #tutorial_intro button:disabled { opacity: 0.5; cursor: wait; }
      #tutorial_panel button { padding: 5px 7px; font-size: 11px; }

      @media (max-width: 900px) {
        #rhythm_banner { left: 12px; width: 212px; padding: 10px 12px; }
        #rhythm_banner strong { font-size: 17px; }
        #rhythm_banner span { font-size: 11px; }
        #tutorial_panel { left: 12px; width: 238px; padding: 12px; }
        #tutorial_cue { font-size: 20px; }
        #tutorial_panel p { font-size: 11px; }
        .tutorial_controls { flex-wrap: wrap; }
      }

      @media (max-width: 650px) {
        #tutorial_panel { top: auto; bottom: 118px; width: 238px; padding: 10px; }
        #tutorial_hint, #tutorial_panel .tutorial_eyebrow { display: none; }
        #tutorial_feedback { min-height: 0; margin: 6px 0; }
        .tutorial_beat { margin: 6px 0; }
        .tutorial_beat span { padding: 4px; }
        #tutorial_score { margin: 6px 0; }
      }

      #hud_corner {
        position: absolute;
        bottom: 4px;
        left: 4px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: calc(100% - 8px);
        pointer-events: none;
      }

      #credits {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0 8px;
        font-size: 11px;
        text-shadow: 1px 1px 0 black;
      }

      #maker_credit {
        flex-basis: 100%;
        margin: 0;
      }

      #coming_soon {
        flex-basis: 100%;
        margin: 0;
      }

      #maker_links,
      #contributor_credit {
        display: block;
      }

      #maker_links a,
      #contributor_credit a {
        color: #ff981f;
        pointer-events: auto;
      }

      #credit_line {
        flex: 1 1 0;
        max-width: 60ch;
        margin: 0;
      }

      #app_version {
        margin: 0;
        white-space: nowrap;
        opacity: 0.8;
      }

      #drill_controls {
        position: relative;
        display: flex;
        gap: 4px;
        margin: 0;
        font-size: 12px;
        pointer-events: auto;
      }

      #drill_controls button,
      #run_result button {
        padding: 2px 8px;
        border: 1px solid #000;
        background: #5a5245;
        color: #ff981f;
        font: inherit;
        cursor: pointer;
      }

      #settings_menu,
      #whats_new_panel,
      #run_result {
        border: 2px solid #000;
        outline: 1px solid #5a5245;
        background: #3e3529;
        color: #ff981f;
        text-shadow: 1px 1px 0 black;
      }

      #settings_menu {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        display: grid;
        gap: 6px;
        justify-items: start;
        max-height: calc(100vh - 145px);
        overflow-y: auto;
        padding: 8px;
        white-space: nowrap;
      }

      #settings_menu[hidden],
      #whats_new_panel[hidden] {
        display: none;
      }

      #whats_new_panel {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        box-sizing: border-box;
        width: min(44ch, calc(100vw - 8px));
        max-height: calc(100vh - 145px);
        overflow-y: auto;
        padding: 8px 12px;
      }

      #whats_new_panel h2 {
        margin: 0 0 6px;
        font-size: 14px;
        color: #ffff00;
      }

      #whats_new_panel h3 {
        margin: 8px 0 4px;
        font-size: 12px;
      }

      #whats_new_panel ul {
        margin: 0 0 8px;
        padding-left: 16px;
        color: #fff;
      }

      #whats_new_panel li + li {
        margin-top: 4px;
      }

      #whats_new_close {
        position: sticky;
        bottom: 0;
      }

      .unseen_dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 4px;
        border-radius: 50%;
        background: #ff0000;
        box-shadow: 0 0 0 1px #000;
        vertical-align: middle;
      }

      #seed {
        width: 10ch;
      }

      #run_result {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 12px 16px;
        text-align: center;
        font-size: 14px;
      }

      #run_result h2 {
        margin: 0 0 6px;
        font-size: 18px;
        color: #ffff00;
      }

      #run_result p {
        margin: 0 0 8px;
      }

      #game_chat {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
